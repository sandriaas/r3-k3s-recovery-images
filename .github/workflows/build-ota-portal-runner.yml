name: Build OTA portal runner image

on:
  push:
    paths:
      - images/ota-portal-runner/**
      - .github/workflows/build-ota-portal-runner.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/r3-k3s-ota-portal-runner
    steps:
      - name: Check out recovery source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=recovery-${{ github.run_id }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: images/ota-portal-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
